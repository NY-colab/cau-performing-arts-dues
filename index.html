<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공연영상학과 학회비 납부 조회</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f6f7f9;
    --paper:#ffffff;
    --ink:#1c2330;
    --ink-soft:#4a5263;
    --muted:#8b929f;
    --line:#e7e9ee;
    --line-soft:#eef0f4;
    --accent:#2d4a77;
    --accent-soft:#eef2f8;
    --paid:#1f7a55; --paid-bg:#eef6f1; --paid-line:#cfe6da;
    --unpaid:#b4543a; --unpaid-bg:#fbf1ed; --unpaid-line:#eed7cd;
    --unknown:#8a6418; --unknown-bg:#fbf6e8; --unknown-line:#eadcae;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .page{max-width:560px;margin:0 auto;padding:0 20px 64px;}

  /* hero */
  .hero{text-align:center;padding:48px 4px 8px;}
  .school{
    display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;
    color:var(--accent);background:var(--accent-soft);
    padding:6px 14px;border-radius:999px;
  }
  .title{
    font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-.02em;
    color:var(--ink);margin:20px 0 0;line-height:1.2;
  }
  .subtitle{font-size:15px;color:var(--muted);margin:10px 0 0;font-weight:400;}

  /* search */
  .search-wrap{margin-top:28px;}
  .search-box{
    display:flex;align-items:center;gap:6px;background:var(--paper);
    border:1px solid var(--line);border-radius:14px;padding:2px 14px;
    box-shadow:0 1px 2px rgba(20,25,40,.04);
    transition:border-color .15s,box-shadow .15s;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-box svg{flex:0 0 auto;color:var(--muted)}
  .search-box input{
    flex:1;border:0;outline:0;background:transparent;font-family:inherit;
    font-size:16px;color:var(--ink);padding:14px 4px;
  }
  .search-box input::placeholder{color:#b3b9c4}
  .hint{font-size:13.5px;color:var(--muted);margin:12px 2px 0;text-align:center;}

  .multi{font-size:13px;color:var(--ink-soft);margin:22px 2px 0;text-align:center;}

  /* results */
  .results{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:20px;box-shadow:0 1px 3px rgba(20,25,40,.05);
    animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tape{display:none}

  .status{
    display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;
    padding:6px 12px;border-radius:999px;border:1px solid transparent;
  }
  .status.paid{color:var(--paid);background:var(--paid-bg);border-color:var(--paid-line);}
  .status.unpaid{color:var(--unpaid);background:var(--unpaid-bg);border-color:var(--unpaid-line);}
  .status.unknown{color:var(--unknown);background:var(--unknown-bg);border-color:var(--unknown-line);}
  .status svg{flex:0 0 auto}

  .name{font-size:24px;font-weight:700;color:var(--ink);margin:14px 0 0;letter-spacing:-.01em;line-height:1.25;}
  .name .alias{font-size:15px;color:var(--muted);margin-left:7px;font-weight:500}

  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{
    font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:8px;
    border:1px solid var(--line);background:#fafbfc;color:var(--ink-soft);
  }
  .chip.major-media{color:#4a3a8c;background:#f3f1fb;border-color:#e4dff5}
  .chip.major-act{color:#9c3a59;background:#fdf0f4;border-color:#f6dde4}
  .chip.major-music{color:#9a5a1c;background:#fcf2e6;border-color:#f3e2cd}
  .chip.major-film{color:#1d7a64;background:#ecf7f3;border-color:#d4ebe3}
  .chip.major-none{color:#6b7280;background:#f4f5f7;border-color:#e7e9ee}
  .chip.id{color:var(--accent);background:var(--accent-soft);border-color:#dde5f0}
  .chip.st-on{color:#2d6a4f;background:#eef6f1;border-color:#d6e9df}
  .chip.st-leave{color:#7a5ea8;background:#f4f0fb;border-color:#e6ddf3}
  .chip.st-quit{color:#9a4444;background:#fbeeee;border-color:#eed7d7}

  .admit{font-size:13.5px;color:var(--muted);margin-top:12px;}
  .note{font-size:13px;color:var(--ink-soft);margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft);line-height:1.6}
  .note.ok{color:var(--paid)}
  .note.no{color:var(--unpaid)}
  .note.unknown{color:var(--unknown)}
  .first-payer{
    display:inline-flex;align-items:center;margin-top:14px;padding:5px 10px;
    border:1px solid #d8e2f0;border-radius:999px;background:#f2f6fb;
    color:var(--accent);font-size:12.5px;font-weight:700;
  }
  .first-payer + .note{margin-top:8px}

  /* empty */
  .empty{text-align:center;padding:40px 14px 12px;}
  .empty .ec{display:inline-flex;opacity:.9}
  .empty h3{font-size:17px;font-weight:700;color:var(--ink);margin:16px 0 6px}
  .empty p{font-size:14px;color:var(--muted);margin:0;line-height:1.6}

  footer{margin-top:36px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
  footer .tag{
    display:inline-block;font-size:12px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:4px 12px;margin-bottom:10px;
  }
  footer p{margin:2px 0}
</style>
</head>

  <header class="hero">

    <h1 class="title">학회비 납부 조회</h1>

</div>

function idLabel(r){return (r.c!==''&&r.c!=null)?(r.c+'기'):'';}
function norm(s){return (s||'').toString().toLowerCase().replace(/\s+/g,'');}

const CHECK='<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#13a06f"/><path d="M6 10.5l2.5 2.5L14 7.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function statusChip(t){
  if(t==='휴학')return '<span class="chip st-leave">휴학</span>';
  if(t==='자퇴')return '<span class="chip st-quit">자퇴</span>';
  return '<span class="chip st-on">재학</span>';
}
function render(q){
  const nq=norm(q);
  if(nq.length<1){
    multiEl.textContent='';
    resEl.innerHTML='<div class="empty"><span class="ec"><svg width="62" height="62" viewBox="0 0 70 70"><rect x="14" y="22" width="42" height="30" rx="4" fill="#d3d9e2"/><rect x="14" y="13" width="42" height="11" rx="2" fill="#2d4a77"/><path d="M20 13l7 11M31 13l7 11M42 13l7 11" stroke="#fff" stroke-width="2.4"/><circle cx="35" cy="38" r="3" fill="#2d4a77"/></svg></span><h3>이름을 검색해 주세요</h3><p>본인 이름을 입력하면<br>학회비 납부 여부를 알려드려요</p></div>';

    return;
  }
  let hits=DATA.filter(r=>r._k.includes(nq));
  hits.sort((a,b)=>{
    const ax=norm(a.n)===nq?0:(norm(a.n).startsWith(nq)?1:2);
    const bx=norm(b.n)===nq?0:(norm(b.n).startsWith(nq)?1:2);
    if(ax!==bx)return ax-bx;return a.n.localeCompare(b.n,'ko');
  });
  if(hits.length===0){
    multiEl.textContent='';hintEl.style.display='none';
    resEl.innerHTML='<div class="empty"><span class="ec"><svg width="60" height="60" viewBox="0 0 64 64"><circle cx="27" cy="27" r="18" stroke="#9aa3b2" stroke-width="5" fill="#fff"/><path d="M40 40l14 14" stroke="#9aa3b2" stroke-width="5" stroke-linecap="round"/><path d="M21 27h12" stroke="#b4543a" stroke-width="4" stroke-linecap="round"/></svg></span><h3>검색 결과가 없어요</h3><p>이름을 다시 확인해 주세요. 졸업생은 조회 대상이 아니며,<br>정보가 없다면 학생회로 문의해 주세요.</p></div>';
    return;
  }

  multiEl.textContent=hits.length>1?('검색 결과 '+hits.length+'명 — 전공·기수로 본인을 확인하세요'):'';
  resEl.innerHTML=hits.map(r=>{

    const state=paid?'paid':(unknown?'unknown':'unpaid');
    const alias=r.a?('<span class="alias">'+r.a.join(', ')+'</span>'):'';

      :(unknown
        ?'<div class="note unknown">기존 자료에서 납부 여부를 확인하기 어려워요. 학생회로 문의해 주세요.</div>'

    const icon=paid?CHECK:(unknown?WAIT:BANG);
    const label=paid?'학회비 납부 완료':(unknown?'납부 여부 확인 필요':'학회비 미납');
    const firstPayer=r.f===1?'<div class="first-payer">이번 학기 첫 납부자</div>':'';

      +'<span class="tape"></span>'
      +'<span class="status '+state+'">'+icon+label+'</span>'
      +'<div class="name">'+r.n+alias+'</div>'
      +'<div class="meta">'+major+(idl?'<span class="chip id">'+idl+'</span>':'')+statusChip(r.t)+'</div>'
      +(adm?'<div class="admit">'+adm+'</div>':'')
      +firstPayer+note+'</div>';
  }).join('');
}
